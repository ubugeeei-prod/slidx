[workspace]
resolver = "2"
members = ["crates/*"]
# The Zed extension is a workspace of its own. Zed compiles it, to
# `wasm32-wasip2`, against its own extension API — a target and a dependency
# tree nothing else here has, and a `cdylib` nothing here links.
exclude = ["editors/zed"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/ubugeeei-prod/slidx"
homepage = "https://github.com/ubugeeei-prod/slidx"
authors = ["ubugeeei"]

[workspace.dependencies]
slidx_brand = { version = "0.1.0", path = "crates/slidx_brand" }
slidx_cli = { version = "0.1.0", path = "crates/slidx_cli" }
slidx_core = { version = "0.1.0", path = "crates/slidx_core" }
slidx_dialect = { version = "0.1.0", path = "crates/slidx_dialect" }
slidx_doctor = { version = "0.1.0", path = "crates/slidx_doctor" }
slidx_edit = { version = "0.1.0", path = "crates/slidx_edit" }
slidx_export = { version = "0.1.0", path = "crates/slidx_export" }
slidx_fmt = { version = "0.1.0", path = "crates/slidx_fmt" }
slidx_highlight = { version = "0.1.0", path = "crates/slidx_highlight" }
slidx_i18n = { version = "0.1.0", path = "crates/slidx_i18n" }
slidx_lint = { version = "0.1.0", path = "crates/slidx_lint" }
slidx_lsp = { version = "0.1.0", path = "crates/slidx_lsp" }
slidx_publish = { version = "0.1.0", path = "crates/slidx_publish" }
slidx_qr = { version = "0.1.0", path = "crates/slidx_qr" }
slidx_render = { version = "0.1.0", path = "crates/slidx_render" }
slidx_theme = { version = "0.1.0", path = "crates/slidx_theme" }
slidx_wasm = { version = "0.1.0", path = "crates/slidx_wasm" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Reads the `#[serde(...)]` attributes it sits next to, so the TypeScript it
# emits describes the JSON serde actually produces rather than a second
# hand-maintained opinion of it.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
insta = { version = "1", features = ["json", "yaml"] }
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.bench]
lto = "thin"

# The wasm artifact ships to every viewer of every deck, so it is optimised for
# size rather than speed. Deck parsing is microseconds either way; bytes over
# the wire are not.
[profile.release.package.slidx_wasm]
opt-level = "z"
