[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/ubugeeei-prod/slidx"
homepage = "https://github.com/ubugeeei-prod/slidx"
authors = ["ubugeeei"]

[workspace.dependencies]
slidx_core = { version = "0.0.1", path = "crates/slidx_core" }
slidx_doctor = { version = "0.0.1", path = "crates/slidx_doctor" }
slidx_highlight = { version = "0.0.1", path = "crates/slidx_highlight" }
slidx_lint = { version = "0.0.1", path = "crates/slidx_lint" }
slidx_qr = { version = "0.0.1", path = "crates/slidx_qr" }
slidx_render = { version = "0.0.1", path = "crates/slidx_render" }
slidx_theme = { version = "0.0.1", path = "crates/slidx_theme" }
slidx_wasm = { version = "0.0.1", path = "crates/slidx_wasm" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
insta = { version = "1", features = ["json", "yaml"] }
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.bench]
lto = "thin"

# The wasm artifact ships to every viewer of every deck, so it is optimised for
# size rather than speed. Deck parsing is microseconds either way; bytes over
# the wire are not.
[profile.release.package.slidx_wasm]
opt-level = "z"
