# The audience channel Worker. Deploy with:
#
#     wrangler deploy
#
# slidx does not log in and does not hold a credential. `wrangler login` is yours.
# The Durable Object name is the room slug from the deck. Nothing here is a
# token, an account id, or a host slidx runs.

name = "slidx-audience"
main = "src/worker.ts"
compatibility_date = "2026-08-25"

[[durable_objects.bindings]]
name = "AUDIENCE_ROOM"
class_name = "AudienceRoom"

[[durable_objects.bindings]]
name = "REMOTE_SESSION"
class_name = "RemoteSession"

[[migrations]]
tag = "v1"
new_classes = ["AudienceRoom"]

[[migrations]]
tag = "v2"
new_classes = ["RemoteSession"]
