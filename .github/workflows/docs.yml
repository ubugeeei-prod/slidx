name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/slidx_docs/**"
      - "assets/brand/**"
      - ".github/workflows/docs.yml"
  # A page that says what a command does is generated from that command's own
  # table, so anything is a documentation change. This is the button for the
  # cases the path filter above misses.
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  # A newer main commit owns production. It must not be overtaken by an older
  # build that happened to finish later.
  cancel-in-progress: true

permissions:
  contents: read
  # `vpx void deploy` exchanges GitHub's short-lived OIDC identity for a
  # project-scoped deployment credential. There is no stored deploy token.
  id-token: write

jobs:
  # The site is checked, built and deployed in one job for the reason the release
  # workflow re-runs CI before publishing: nothing about a push to `main`
  # proves the tree is good, and a documentation site that publishes a dead
  # link is a site nobody trusts twice.
  #
  # `test:rust` is what does the checking. It reads the real pages, renders
  # every one of them, and fails on a link to a page that does not exist, a
  # page in a section that does not exist, or a placeholder asking for a
  # generated table that nothing generates.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"

      - name: Check the pages
        run: cargo test -p slidx_docs

      - name: Build the site
        run: pnpm exec vp run docs:build

      - name: Deploy
        env:
          VOID_PROJECT: ${{ vars.VOID_PROJECT }}
        # An explicitly versioned `vpx` command delegates to `vp dlx`. The
        # repository package supplies `vp`; defining the thin command here
        # keeps CI independent of a machine-global Vite+ installation.
        run: |
          vpx() { pnpm exec vp dlx "$@"; }
          vpx void@0.10.11 deploy --dir docs/dist --project "$VOID_PROJECT"
