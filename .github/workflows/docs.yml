name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/slidx_docs/**"
      - "assets/brand/**"
      - ".github/workflows/docs.yml"
  # A page that says what a command does is generated from that command's own
  # table, so anything is a documentation change. This is the button for the
  # cases the path filter above misses.
  workflow_dispatch:

concurrency:
  group: docs
  # A half-deployed site is worse than a stale one, and Pages has no rollback.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The site is built and checked in one job for the reason the release
  # workflow re-runs CI before publishing: nothing about a push to `main`
  # proves the tree is good, and a documentation site that publishes a dead
  # link is a site nobody trusts twice.
  #
  # `test:rust` is what does the checking. It reads the real pages, renders
  # every one of them, and fails on a link to a page that does not exist, a
  # page in a section that does not exist, or a placeholder asking for a
  # generated table that nothing generates.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"

      - name: Check the pages
        run: cargo test -p slidx_docs

      - name: Build the site
        run: pnpm exec vp run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # Mints the OIDC token Pages exchanges for a short-lived deployment
      # credential, the same arrangement crates.io and npm publishing use in
      # `release.yml`. No deploy key and no token is stored in this repository.
      id-token: write
      pages: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
