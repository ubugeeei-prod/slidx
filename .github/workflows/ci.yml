name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # A release runs the same checks before it publishes anything, by calling
  # this workflow rather than restating it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Layout rules are a property of the tree, not of a platform, so one runner
  # settles them.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec vp run ci:conventions
      - run: node scripts/check-version.mjs

  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: pnpm exec vp run ci:rust

  typescript:
    name: typescript / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
          browser: "true"
      - run: pnpm exec vp run ci:ts

  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
      - run: pnpm exec vp run ci:build

  # One check to require on the branch, so adding a job to the matrix above
  # never needs the ruleset edited to match.
  ci:
    name: ci
    if: always()
    needs: [conventions, rust, typescript, build]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
