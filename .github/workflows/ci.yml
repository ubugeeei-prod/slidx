name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # A release runs the same checks before it publishes anything, by calling
  # this workflow rather than restating it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Layout rules are a property of the tree, not of a platform, so one runner
  # settles them.
  conventions:
    name: conventions
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/setup
      - run: pnpm exec vp run ci:conventions
      - run: node scripts/check-version.mjs

  # Which runners this run uses.
  #
  # TypeScript and builds on a pull request are checked on Linux alone. Rust
  # also runs on Windows because its filesystem, process and socket behaviour
  # differs materially, and those differences need to stop a pull request
  # before it reaches main.
  #
  # So the full matrix runs where it settles something: on main, and on the
  # release workflow that calls this one before it publishes. macOS Rust and
  # the complete TypeScript/build matrix remain there; Windows Rust is the
  # deliberate extra PR guard.
  platforms:
    name: platforms
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      all: ${{ steps.pick.outputs.all }}
      browsers: ${{ steps.pick.outputs.browsers }}
      rust: ${{ steps.pick.outputs.rust }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'all=["blacksmith-32vcpu-ubuntu-2404"]' >> "$GITHUB_OUTPUT"
            echo 'browsers=["blacksmith-32vcpu-ubuntu-2404"]' >> "$GITHUB_OUTPUT"
            echo 'rust=["blacksmith-32vcpu-ubuntu-2404","blacksmith-32vcpu-windows-2025"]' >> "$GITHUB_OUTPUT"
          else
            echo 'all=["blacksmith-32vcpu-ubuntu-2404","blacksmith-12vcpu-macos-latest","blacksmith-32vcpu-windows-2025"]' >> "$GITHUB_OUTPUT"
            echo 'browsers=["blacksmith-32vcpu-ubuntu-2404","blacksmith-12vcpu-macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'rust=["blacksmith-32vcpu-ubuntu-2404","blacksmith-12vcpu-macos-latest","blacksmith-32vcpu-windows-2025"]' >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.rust) }}
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@v1
      - if: runner.os != 'Linux'
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: pnpm exec vp run ci:rust

  typescript:
    name: typescript / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.all) }}
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@v1
      - if: runner.os != 'Linux'
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
          browsers: chromium
      - run: pnpm exec vp run ci:ts

  build:
    name: build / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.all) }}
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@v1
      - if: runner.os != 'Linux'
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
      - run: pnpm exec vp run ci:build

  # The layout mechanism is one CSS rule carrying the whole design, with no
  # script to fall back on, so every engine gets to prove it rather than being
  # assumed to support it. macOS is in the matrix because WebKit there is the
  # build closest to the Safari a speaker will actually open.
  browsers:
    name: browsers / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.browsers) }}
    steps:
      - if: runner.os == 'Linux'
        uses: useblacksmith/checkout@v1
      - if: runner.os != 'Linux'
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
          browsers: chromium firefox webkit
      - run: pnpm exec vp run ci:browsers

  # The Zed extension compiles to a target nothing else here uses, in a Cargo
  # workspace of its own. One runner settles it: it is glue, Zed builds it the
  # same way on every platform, and asking three runners to install
  # wasm32-wasip2 would buy nothing. Without this job, a change to it would be
  # found by whoever next tried to install the extension.
  zed:
    name: zed extension
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: rustup target add wasm32-wasip2
      - run: pnpm exec vp run build:zed

  # One artifact serves every runtime, and each one instantiates it itself.
  # That path is where they differ, so all three build the same deck and the
  # digests are compared.
  runtimes:
    name: runtimes
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm exec vp run build:packages
      - run: pnpm exec vp test run packages/vite-plugin/test/runtime.test.ts

  # One check to require on the branch, so adding a job to the matrix above
  # never needs the ruleset edited to match.
  ci:
    name: ci
    if: always()
    needs: [conventions, rust, typescript, build, zed, browsers, runtimes]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - name: Report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
