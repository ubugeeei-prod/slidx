name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # A release runs the same checks before it publishes anything, by calling
  # this workflow rather than restating it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Layout rules are a property of the tree, not of a platform, so one runner
  # settles them.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec vp run ci:conventions
      - run: node scripts/check-version.mjs

  # Which runners this run uses.
  #
  # A pull request is checked on Linux alone. Running three platforms on every
  # push and then all three again on the way to main is the same work twice, and
  # the second time is the one that decides whether main is good.
  #
  # So the full matrix runs where it settles something: on main, and on the
  # release workflow that calls this one before it publishes. The cost is that a
  # Windows-only break reaches main and is caught by main's own run rather than
  # by the pull request — a slower report on a rarer failure, which is the trade
  # this repository wants while a wave of work is landing.
  platforms:
    name: platforms
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.pick.outputs.all }}
      browsers: ${{ steps.pick.outputs.browsers }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'all=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'browsers=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'all=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'browsers=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: pnpm exec vp run ci:rust

  typescript:
    name: typescript / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
          browsers: chromium
      - run: pnpm exec vp run ci:ts

  build:
    name: build / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
      - run: pnpm exec vp run ci:build

  # The layout mechanism is one CSS rule carrying the whole design, with no
  # script to fall back on, so every engine gets to prove it rather than being
  # assumed to support it. macOS is in the matrix because WebKit there is the
  # build closest to the Safari a speaker will actually open.
  browsers:
    name: browsers / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
          browsers: chromium firefox webkit
      - run: pnpm exec vp run build:packages
      - run: pnpm exec vp test run packages/vite-plugin/test/browser.test.ts

  # One artifact serves every runtime, and each one instantiates it itself.
  # That path is where they differ, so all three build the same deck and the
  # digests are compared.
  runtimes:
    name: runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          wasm: "true"
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm exec vp run build:packages
      - run: pnpm exec vp test run packages/vite-plugin/test/runtime.test.ts

  # One check to require on the branch, so adding a job to the matrix above
  # never needs the ruleset edited to match.
  ci:
    name: ci
    if: always()
    needs: [conventions, rust, typescript, build, browsers, runtimes]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
