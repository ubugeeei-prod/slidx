name: Release provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify and attest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: attest release assets
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern 'slidx-*' \
            --pattern SHA256SUMS

      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/slidx-*
