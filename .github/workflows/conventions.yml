name: Conventions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layout:
    name: layout conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No mod.rs
        run: |
          # A directory full of files called mod.rs is unnavigable in an
          # editor's file switcher. Use the 2018 path style: foo.rs + foo/.
          if found=$(find crates -name mod.rs -print 2>/dev/null) && [ -n "$found" ]; then
            echo "::error::mod.rs is not allowed; use foo.rs alongside foo/"
            echo "$found"
            exit 1
          fi

      - name: Source files stay small
        run: |
          # Past ~250 lines a module is usually holding two ideas.
          limit=250
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt "$limit" ]; then
              echo "::warning file=$file::$lines lines, over the $limit line guideline"
            fi
          done < <(find crates packages -name '*.rs' -o -name '*.ts' 2>/dev/null | grep -v node_modules | grep -v '/tests\?/')
          exit $status
