name: Set up slidx
description: Node, pnpm, and optionally Rust, with the caches each of them wants.

inputs:
  rust:
    description: Install the Rust toolchain and its cache. Skip it for jobs that only touch TypeScript.
    default: "false"
  wasm:
    description: Also install the wasm32 target and a matching wasm-bindgen. Implies rust.
    default: "false"
  browser:
    description: Download the Chromium build Playwright drives. Only jobs that export a PDF need it.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - if: inputs.rust == 'true' && inputs.wasm != 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - if: inputs.wasm == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    # Prebuilt. `cargo install wasm-bindgen-cli` compiles it from source and
    # would dominate the job. The version has to match the crate exactly, so it
    # is read from the manifest rather than repeated here.
    - if: inputs.wasm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version=$(grep -oE 'wasm-bindgen = "=([0-9.]+)"' crates/slidx_wasm/Cargo.toml | grep -oE '[0-9.]+')
        echo "BINDGEN_VERSION=$version" >> "$GITHUB_ENV"

    - if: inputs.wasm == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen-cli@${{ env.BINDGEN_VERSION }}

    - if: inputs.rust == 'true' || inputs.wasm == 'true'
      uses: Swatinem/rust-cache@v2

    # Vite+ caches task results by content hash, so a job that changed nothing
    # replays instead of re-running.
    - uses: actions/cache@v4
      with:
        path: node_modules/.cache/vite-plus
        key: vp-${{ runner.os }}-${{ inputs.rust }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}
        restore-keys: vp-${{ runner.os }}-${{ inputs.rust }}-

    - run: pnpm install --frozen-lockfile
      shell: bash

    # The npm package is only the driver. pnpm does not run its postinstall,
    # so the browser it drives has to be fetched on purpose, and the PDF
    # export is checked against a real one rather than a mock.
    - if: inputs.browser == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
