name: Set up slidx
description: Node, pnpm, and optionally Rust, with the caches each of them wants.

inputs:
  rust:
    description: Install the Rust toolchain and its cache. Skip it for jobs that only touch TypeScript.
    default: "false"
  wasm:
    description: Also install the wasm32 target and a matching wasm-bindgen. Implies rust.
    default: "false"
  browsers:
    description: >
      Space-separated Playwright browsers to download, or empty for none.
      `chromium` is what the PDF export drives; the full matrix job asks for all three.
    default: ""
  sticky:
    description: Mount Blacksmith Sticky Disks. Disable only on a runner that cannot use them.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - if: runner.os == 'Linux' && inputs.sticky == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - if: runner.os == 'Linux' && inputs.sticky != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - if: runner.os != 'Linux'
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    # A Blacksmith checkout keeps the Git mirror on its own sticky disk. These
    # five mounts use the full per-job dependency allowance for everything
    # expensive that the package managers and browser tests leave on disk.
    - if: runner.os == 'Linux' && inputs.sticky == 'true'
      name: Mount pnpm store
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-${{ runner.arch }}-pnpm-store
        path: ~/.local/share/pnpm/store
        commit: on-change

    - if: runner.os == 'Linux' && inputs.sticky == 'true'
      name: Mount node_modules
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-${{ runner.arch }}-node-modules
        path: ./node_modules
        commit: on-change

    - if: runner.os == 'Linux' && inputs.sticky == 'true'
      name: Mount Cargo home
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-${{ runner.arch }}-cargo-home
        path: ~/.cargo
        commit: on-change

    - if: runner.os == 'Linux' && inputs.sticky == 'true'
      name: Mount Cargo target
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-${{ runner.arch }}-cargo-target
        path: ./target
        commit: on-change

    - if: runner.os == 'Linux' && inputs.sticky == 'true'
      name: Mount Playwright browsers
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-${{ runner.arch }}-playwright
        path: ~/.cache/ms-playwright
        commit: on-change

    - if: inputs.rust == 'true' && inputs.wasm != 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - if: inputs.wasm == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    # Prebuilt. `cargo install wasm-bindgen-cli` compiles it from source and
    # would dominate the job. The version has to match the crate exactly, so it
    # is read from the manifest rather than repeated here.
    - if: inputs.wasm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version=$(grep -oE 'wasm-bindgen = "=([0-9.]+)"' crates/slidx_wasm/Cargo.toml | grep -oE '[0-9.]+')
        echo "BINDGEN_VERSION=$version" >> "$GITHUB_ENV"

    - if: inputs.wasm == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen-cli@${{ env.BINDGEN_VERSION }}

    - if: runner.os != 'Linux' && (inputs.rust == 'true' || inputs.wasm == 'true')
      uses: Swatinem/rust-cache@v2

    # Vite+ caches task results by content hash, so a job that changed nothing
    # replays instead of re-running.
    - if: runner.os != 'Linux'
      uses: actions/cache@v5
      with:
        path: node_modules/.cache/vite-plus
        key: vp-${{ runner.os }}-${{ inputs.rust }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}
        restore-keys: vp-${{ runner.os }}-${{ inputs.rust }}-

    - run: pnpm install --frozen-lockfile
      shell: bash

    # The npm package is only the driver. pnpm does not run its postinstall,
    # so the browsers it drives have to be fetched on purpose, and the deck is
    # checked against real ones rather than a mock.
    - if: inputs.browsers != ''
      shell: bash
      run: pnpm exec playwright install --with-deps ${{ inputs.browsers }}
