packages:
  - "packages/*"
  - "packages/integrations/*"
  - "examples/*"
  - "docs"
  # The `slidx` npm wrapper is published from this repository and never
  # installed into it. Its only dependencies are the five per-platform binary
  # packages, which exist on the registry and nowhere else — pulling them into
  # the workspace would mean this repository could not be installed until they
  # were published, and they cannot be published without an install. Nothing
  # here imports it; its tests read its files directly.
  - "!packages/cli"

# One version of the toolchain across the whole repository. Vite+ ships its own
# Vite, Vitest, oxlint, and oxfmt, so pinning it pins all of them together.
catalog:
  "@types/node": ^24.0.0
  happy-dom: ^20.11.1
  typescript: ^5.9.0
  vite: ^7.3.6
  vite-plus: 0.2.6
