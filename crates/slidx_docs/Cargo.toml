[package]
name = "slidx_docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The documentation site, rendered by the engine slidx renders decks with"
# Not a product. Nothing outside this repository consumes it, and a site
# generator on crates.io would be a package nobody can use for anything.
publish = false

[dependencies]
slidx_brand = { workspace = true }
slidx_core = { workspace = true }
slidx_render = { workspace = true }
slidx_theme = { workspace = true }
serde_json = { workspace = true }
