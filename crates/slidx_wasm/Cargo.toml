[package]
name = "slidx_wasm"
description = "WebAssembly bindings for the slidx deck pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slidx_core = { workspace = true }
slidx_edit = { workspace = true }
slidx_lint = { workspace = true }
slidx_render = { workspace = true }
slidx_theme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Pinned exactly: the generated glue and the CLI that generates it are one
# unit, and a mismatch fails with a message about recompiling rather than
# about versions. `scripts/build-wasm.mjs` checks the two agree before it runs.
wasm-bindgen = "=0.2.121"
serde-wasm-bindgen = "0.6"
