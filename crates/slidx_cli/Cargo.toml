[package]
name = "slidx_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The slidx command line: the pre-flight a speaker runs in the room, and the linter their CI runs"

# The published binary is `slidx`; the crate is `slidx_cli` so it sorts with its
# siblings on crates.io and in this workspace.
[[bin]]
name = "slidx"
path = "src/main.rs"

[dependencies]
slidx_core = { workspace = true }
slidx_dialect = { workspace = true }
slidx_doctor = { workspace = true }
# Every byte the CLI writes into an existing deck is a splice this crate
# computed. A command that composed Markdown itself would be the second writer
# the editor's round trip exists to prevent.
slidx_edit = { workspace = true }
slidx_export = { workspace = true }
slidx_fmt = { workspace = true }
slidx_highlight = { workspace = true }
slidx_i18n = { workspace = true }
slidx_lint = { workspace = true }
# `slidx lsp` is the language server, and it is a subcommand rather than a
# second binary because an editor extension has to *find* what it starts. One
# binary is one PATH entry, one release asset, and one `.slidx-version` pin.
slidx_lsp = { workspace = true }
slidx_publish = { workspace = true }
slidx_qr = { workspace = true }
slidx_theme = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
